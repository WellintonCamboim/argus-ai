[project]
name = "argus-agent"
version = "0.1.0"
description = "Agente de suporte: analisa documentação, consulta Grafana/logs e banco de dados para investigar bugs e responder dúvidas."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_agent"]

[tool.ruff]
line-length = 100
